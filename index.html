
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#10233b"
  >

  <title>Saturday Dynasty</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <header>
    <div>
      <h1>🏈 SATURDAY DYNASTY</h1>

      <small id="sub">
        College Football Dynasty Manager
      </small>
    </div>


      <button onclick="save()">
        Save
      </button>

      <button onclick="exportSave()">
        Export
      </button>

      <button onclick="
        document.getElementById('upload').click()
      ">
        Import
      </button>

      <input
        hidden
        id="upload"
        type="file"
        accept=".json"
        onchange="importSave(this)"
      >

      <button onclick="startNewDynasty()">
        New Dynasty
      </button>
    </div>
  </header>

  <nav id="nav"></nav>

  <main id="main"></main>

  <dialog id="modal"></dialog>

  <dialog id="spotlight"></dialog>

<button onclick="
  try {
    const output = sdDevelopment();

    alert(
      'Development generated ' +
      output.length +
      ' characters of content.'
    );

    document.getElementById('main').innerHTML =
      output;

    tab = 'Player Development';

  } catch (error) {
    alert(
      'DEVELOPMENT ERROR: ' +
      error.message
    );
  }
">
  TEST DEVELOPMENT ENGINE
</button>

  TEST DEVELOPMENT ENGINE
</button>


  <!-- Base game data and simulation -->

  <script src="./data.js"></script>
  <script src="./core.js"></script>
  <script src="./coaches.js"></script>
  <script src="./rivalries.js"></script>
  <script src="./simulation.js"></script>

  <!-- Game interface -->

  <script src="./presentation.js"></script>
  <script src="./depth.js?v=3"></script>
  <script src="./needs.js"></script>

  <!-- Coaching systems -->

  <script src="./abilities.js"></script>
  <script src="./career-goals.js?v=2"></script>
  <script src="./final-integration.js"></script>

  <!-- Diagnostics -->

  <script src="./performance-and-tiers.js"></script>

  <!-- New coaching career system -->

  
<script src="./career-mode.js"></script>
<script src="./development-fix.js?v=2"></script>
<script src="./postseason-ui.js?v=2"></script>
<script src="./clean-ui.js?v=1"></script>
<script src="./office-upgrade.js?v=1"></script>
<script src="./gameweek-hq.js?v=1"></script>
<script src="./coach-progression.js?v=1"></script>  
  <!-- Startup must always load last -->
<script src="./startup.js"></script>

</body>
</html>
